version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: techstore-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techpass}
      POSTGRES_DB: ${POSTGRES_DB:-techstoredb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techuser} -d ${POSTGRES_DB:-techstoredb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6-jammy
    container_name: techstore-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongopass}
      MONGO_INITDB_DATABASE: techstore_audit
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techstore-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: "*"
      DATABASE_URL: postgresql://${POSTGRES_USER:-techuser}:${POSTGRES_PASSWORD:-techpass}@postgres:5432/${POSTGRES_DB:-techstoredb}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-techuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techpass}
      POSTGRES_DB: ${POSTGRES_DB:-techstoredb}
      MONGO_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-mongopass}@mongodb:27017/techstore_audit?authSource=admin
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techstore-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: techstore-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: techstore-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.0.3
    container_name: techstore-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mongo_data:
