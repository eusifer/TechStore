name: TechStore CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build, Lint & Automated E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: techuser
          POSTGRES_PASSWORD: techpass
          POSTGRES_DB: techstoredb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:6-jammy
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: mongopass
          MONGO_INITDB_DATABASE: techstore_audit
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Backend (TypeScript Compilation)
        run: |
          cd backend
          npm run build

      - name: Build Frontend (Vite Production Assets)
        run: |
          cd frontend
          npm run build

      - name: Start Backend REST API Server
        env:
          PORT: 5000
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: techuser
          POSTGRES_PASSWORD: techpass
          POSTGRES_DB: techstoredb
          MONGO_URI: mongodb://root:mongopass@localhost:27017/techstore_audit?authSource=admin
        run: |
          cd backend
          npm start &
          sleep 5

      - name: Run Newman E2E API Tests (12/12 Assertions)
        run: |
          npx -y newman run postman/TechStore.postman_collection.json

      - name: Validate Container & Infrastructure Manifests
        run: |
          echo "Validating Docker & K8s artifacts..."
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          test -f nginx/Dockerfile
          test -f docker-compose.yml
          test -f k8s/nginx.yaml
